<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#474b4d",
                        "on-surface": "#111c2d",
                        "on-secondary-fixed": "#00201c",
                        "on-tertiary-fixed": "#191c1e",
                        "on-background": "#111c2d",
                        "surface": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#444749",
                        "on-primary-fixed-variant": "#07497d",
                        "secondary-fixed": "#62fae3",
                        "error": "#ba1a1a",
                        "surface-bright": "#f9f9ff",
                        "background": "#f9f9ff",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#ecf1ff",
                        "error-container": "#ffdad6",
                        "secondary": "#006b5f",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "tertiary-fixed": "#e0e3e5",
                        "primary-fixed": "#d2e4ff",
                        "secondary-fixed-dim": "#3cddc7",
                        "secondary-container": "#62fae3",
                        "primary-fixed-dim": "#a0c9ff",
                        "surface-tint": "#2d6197",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#b8bbbc",
                        "inverse-primary": "#a0c9ff",
                        "on-surface-variant": "#42474f",
                        "on-secondary-fixed-variant": "#005047",
                        "surface-container": "#e7eeff",
                        "inverse-surface": "#263143",
                        "surface-container-highest": "#d8e3fb",
                        "surface-dim": "#cfdaf2",
                        "primary-container": "#0f4c81",
                        "on-primary-fixed": "#001c37",
                        "outline-variant": "#c2c7d1",
                        "on-secondary-container": "#007165",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#727780",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#8ebdf9",
                        "primary": "#00355f",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#dee8ff",
                        "tertiary": "#313436",
                        "surface-variant": "#d8e3fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-card": "16px",
                        "unit": "4px",
                        "stack-lg": "24px",
                        "padding-search": "12px 16px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "margin-page": "20px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "phonetic-display": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "phonetic-display": ["18px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md">
<!-- Top Navigation Bar (Branding only for focused flow) -->
<header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-md shadow-sm h-16 flex items-center px-margin-page justify-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary">Lexicon</h1>
</div>
</header>
<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-margin-page">
<div class="w-full max-w-md space-y-stack-lg">
<!-- Header Section -->
<div class="text-center space-y-unit">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Create your scholar account.</h2>
<p class="text-on-surface-variant font-body-md text-body-md">Unlock the full power of linguistic mastery.</p>
</div>
<!-- Social Login Bento Grid -->
<div class="grid grid-cols-2 gap-stack-md">
<button class="flex items-center justify-center gap-stack-sm py-3 px-4 border border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAvp2PmeWaKEA4Rxuki18s-FFuBbHstdrSjTujPOqa-4aYzdgtt1r7WGUYU7BMbiA8xnpwQCCEdB8BlqtbEYxw89gHGsEe9C1D3aZ99IZ1OgIVTubolgHhuC8j7FdYvYdLVslv2f6G10hoGp7fvCQycjuXcqc10_Bsd99QEOUkK_4jVeE2VdYNKLZjssdeAC2PjeeNzIvwJ-WfUPeUKxO-hmZ9eT-Y23uuAfoBZ-uaec2b0vg7r-4yQcwhFhaEiBfIAPIgiV62sfkM"/>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-stack-sm py-3 px-4 border border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">apps</span>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
<div class="relative flex items-center py-stack-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-on-surface-variant font-label-sm text-label-sm">OR CONTINUE WITH EMAIL</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Sign Up Form -->
<form class="space-y-stack-md" onsubmit="event.preventDefault();">
<div class="space-y-unit">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary text-body-md font-body-md" id="name" placeholder="Enter your full name" type="text"/>
</div>
</div>
<div class="space-y-unit">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary text-body-md font-body-md" id="email" placeholder="scholar@lexicon.edu" type="email"/>
</div>
</div>
<div class="space-y-unit">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary text-body-md font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="terms" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant leading-tight" for="terms">
                        I agree to the <a class="text-secondary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-secondary font-semibold hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Primary Action -->
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-label-md text-label-md shadow-lg hover:shadow-xl transition-all active:scale-[0.98] mt-stack-lg" type="submit">
                    Create Account
                </button>
</form>
<!-- Footer Link -->
<div class="text-center pt-stack-md">
<p class="text-on-surface-variant font-body-md text-body-md">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
</div>
</main>
<!-- Visual Decorative Element (Aesthetic Background Detail) -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-1/3 bg-secondary-container/20 blur-[120px] rounded-full"></div>
<div class="fixed bottom-0 left-0 -z-10 w-1/2 h-1/2 bg-primary-container/10 blur-[160px] rounded-full"></div>
<script>
        // Simple Interaction for Password Visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.querySelector('.material-symbols-outlined').textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Form submission feedback
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            const btn = form.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            setTimeout(() => {
                btn.innerHTML = 'Account Created!';
                btn.classList.replace('bg-primary', 'bg-secondary');
            }, 1500);
        });
    </script>
</body></html>
