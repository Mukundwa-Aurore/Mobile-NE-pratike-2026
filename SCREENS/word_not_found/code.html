<script>
        function focusSearch() {
            // Visual feedback for returning to search
            const main = document.querySelector('main');
            main.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                // Simulate a redirect or focus state
                alert('Ready for a new search! Redirecting to home...');
                location.reload();
            }, 300);
        }

        // Entrance animation logic
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-fade-in');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = `all 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.1}s`;
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 50);
            });
        });
    </script>
