<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-container": "#474b4d",
                    "on-surface": "#111c2d",
                    "on-secondary-fixed": "#00201c",
                    "on-tertiary-fixed": "#191c1e",
                    "on-background": "#111c2d",
                    "surface": "#f9f9ff",
                    "on-tertiary-fixed-variant": "#444749",
                    "on-primary-fixed-variant": "#07497d",
                    "secondary-fixed": "#62fae3",
                    "error": "#ba1a1a",
                    "surface-bright": "#f9f9ff",
                    "background": "#f9f9ff",
                    "tertiary-fixed-dim": "#c4c7c9",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#ecf1ff",
                    "error-container": "#ffdad6",
                    "secondary": "#006b5f",
                    "on-error": "#ffffff",
                    "surface-container-low": "#f0f3ff",
                    "tertiary-fixed": "#e0e3e5",
                    "primary-fixed": "#d2e4ff",
                    "secondary-fixed-dim": "#3cddc7",
                    "secondary-container": "#62fae3",
                    "primary-fixed-dim": "#a0c9ff",
                    "surface-tint": "#2d6197",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#b8bbbc",
                    "inverse-primary": "#a0c9ff",
                    "on-surface-variant": "#42474f",
                    "on-secondary-fixed-variant": "#005047",
                    "surface-container": "#e7eeff",
                    "inverse-surface": "#263143",
                    "surface-container-highest": "#d8e3fb",
                    "surface-dim": "#cfdaf2",
                    "primary-container": "#0f4c81",
                    "on-primary-fixed": "#001c37",
                    "outline-variant": "#c2c7d1",
                    "on-secondary-container": "#007165",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#727780",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#8ebdf9",
                    "primary": "#00355f",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#dee8ff",
                    "tertiary": "#313436",
                    "surface-variant": "#d8e3fb"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter-card": "16px",
                    "unit": "4px",
                    "stack-lg": "24px",
                    "padding-search": "12px 16px",
                    "stack-sm": "8px",
                    "stack-md": "16px",
                    "margin-page": "20px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "phonetic-display": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "phonetic-display": ["18px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        body {
            background-color: #f9f9ff;
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-md shadow-sm">
<div class="flex items-center justify-between px-margin-page h-16 w-full max-w-md mx-auto">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant/50 transition-colors rounded-full active:opacity-70 active:scale-95">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary">Lexicon</h1>
</div>
<button class="p-2 hover:bg-surface-variant/50 transition-colors rounded-full active:opacity-70 active:scale-95">
<span class="material-symbols-outlined text-primary">search</span>
</button>
</div>
</header>
<main class="pt-20 px-margin-page max-w-md mx-auto">
<!-- Profile Header -->
<section class="flex flex-col items-center mt-stack-lg mb-stack-lg">
<div class="relative">
<div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-lg">
<img alt="Kigali Scholar Profile" class="w-full h-full object-cover" data-alt="A professional and friendly portrait of a young African scholar in a modern, sunlit library setting. The lighting is warm and natural, emphasizing a bright and clean light-mode aesthetic. The individual has a confident smile, wearing stylish glasses that reflect the tech-forward energy of Kigali. The background is softly blurred with hints of teal books and sapphire accents, maintaining a sophisticated and academic atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC99uu3i72u3o-1i9J66bu4-6ycTCwqtklJLD1MmwhLv4vNvF6b6aAup0D9dP4uokgEpO5NMXKzKOyn-2ju_pevVz1qE91Q0THWkHNe57Iu9iXIGsbDtwzvTSpUfcYW2cnS30D-UkdO_pUatWFQ54QKdTNYLqVacNyi0VSPoac2xvtPAr5EiSS1VZgW9Cc2VtXrCI5CcnjKFrZjhFN0S5h9RBeF_gWnmEBaNthH9eDKcLlxrEdlTj2Fmq-El2QpUK-GjPoYlY45LDo"/>
</div>
<div class="absolute bottom-0 right-0 bg-secondary text-on-secondary px-3 py-1 rounded-full text-label-sm font-label-sm shadow-md border-2 border-surface">
                    Pro Member
                </div>
</div>
<h2 class="mt-4 font-headline-md text-headline-md text-on-surface">Kigali Scholar</h2>
<p class="text-on-surface-variant font-body-md text-body-md">Linguistics Enthusiast</p>
</section>
<!-- Stats Section (Bento Style) -->
<section class="grid grid-cols-2 gap-3 mb-stack-lg">
<div class="bg-white p-4 rounded-xl shadow-sm border border-surface-container-highest flex flex-col items-center justify-center text-center">
<span class="text-primary font-headline-md text-headline-md">128</span>
<span class="text-on-surface-variant font-label-sm text-label-sm">Words Learned</span>
</div>
<div class="bg-white p-4 rounded-xl shadow-sm border border-surface-container-highest flex flex-col items-center justify-center text-center">
<span class="text-primary font-headline-md text-headline-md">45</span>
<span class="text-on-surface-variant font-label-sm text-label-sm">Bookmarks</span>
</div>
<div class="col-span-2 bg-secondary-container/30 p-4 rounded-xl shadow-sm border border-secondary-container/50 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="bg-secondary p-2 rounded-lg">
<span class="material-symbols-outlined text-on-secondary" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div class="flex flex-col">
<span class="text-on-secondary-container font-headline-md text-headline-md">12 Day Streak</span>
<span class="text-on-secondary-container/80 font-label-sm text-label-sm">You're on fire! Keep it up.</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary">trending_up</span>
</div>
</section>
<!-- Options List -->
<section class="flex flex-col gap-2">
<button class="flex items-center justify-between p-4 bg-white rounded-xl shadow-sm hover:bg-surface-container-high transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">edit</span>
<span class="font-label-md text-label-md text-on-surface">Edit Profile</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<button class="flex items-center justify-between p-4 bg-white rounded-xl shadow-sm hover:bg-surface-container-high transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">bookmark</span>
<span class="font-label-md text-label-md text-on-surface">Saved Words</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<button class="flex items-center justify-between p-4 bg-white rounded-xl shadow-sm hover:bg-surface-container-high transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">auto_graph</span>
<span class="font-label-md text-label-md text-on-surface">Learning Progress</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<button class="flex items-center justify-between p-4 bg-white rounded-xl shadow-sm hover:bg-surface-container-high transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">settings</span>
<span class="font-label-md text-label-md text-on-surface">Settings</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<button class="flex items-center justify-between p-4 bg-white rounded-xl shadow-sm hover:bg-surface-container-high transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">help</span>
<span class="font-label-md text-label-md text-on-surface">Help &amp; Support</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</section>
<!-- Logout Button -->
<section class="mt-stack-lg mb-8">
<button class="w-full py-4 rounded-xl border-2 border-error/20 text-error font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-error-container/20 transition-colors active:scale-95">
<span class="material-symbols-outlined">logout</span>
                Log out
            </button>
<p class="text-center mt-6 text-on-surface-variant/40 font-label-sm text-label-sm">Lexicon v2.4.0 • Built for Scholars</p>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full bg-surface/85 backdrop-blur-md flex justify-around items-center px-4 py-3 pb-safe z-50 shadow-lg rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/30 transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined">search</span>
<span class="font-label-md text-label-md">Search</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/30 transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/30 transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined">bookmark</span>
<span class="font-label-md text-label-md">Saved</span>
</button>
<!-- Mapping to "Profile" state even though not in JSON explicitly, semantic mapping for current screen -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
</nav>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.opacity = '0.7';
            });
            btn.addEventListener('touchend', () => {
                btn.style.opacity = '1';
            });
        });
    </script>
</body></html>
